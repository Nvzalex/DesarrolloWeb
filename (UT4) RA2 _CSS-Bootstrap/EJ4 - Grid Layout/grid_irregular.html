<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        padding: 20px;
      }

      /* Contenedor principal */
      body > div {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 24px;
        max-width: 900px;
        margin: 0 auto;
        align-items: start;
      }

      /* === Zona de imágenes === */
      .imagenes {
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto;
        gap: 12px;
        position: relative;
      }

      /* Botón de corazón (favorito) */
      .heart {
        grid-column: 1;
        grid-row: 1;
        width: 44px;
        height: 44px;
        background-color: white;
        border-radius: 50%;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .heart img {
        width: 24px;
        height: 24px;
      }

      /* Imagen grande */
      .img-big {
        grid-column: 2;
        grid-row: 1 / 3;
        position: relative;
        background: #f5f5f5;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 320px;
      }

      .img-big img:first-child {
        width: 100%;
        height: 100%;
        max-height: 400px;
        object-fit: contain;
      }

      /* Flecha (navegación) */
      .img-big img:last-child {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 32px;
        height: 32px;
        cursor: pointer;
      }

      /* Miniaturas */
      .img-small {
        grid-column: 1;
        grid-row: 2;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .img-small img {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #ddd;
        cursor: pointer;
      }

      /* === Zona de información / botones === */
      .info {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 160px;
      }

      /* Botón azul - Contactar */
      .blue-boton {
        background-color: #055fb3;
        color: white;
        border-radius: 8px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
      }

      .blue-boton img {
        width: 20px;
        height: 20px;
      }

      .blue-boton p {
        color: white;
        font-size: 0.95rem;
        font-weight: 500;
      }

      /* Botón blanco - Avísame si baja */
      .white-boton {
        border: 1px solid #055fb3;
        border-radius: 8px;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        text-align: center;
      }

      .white-boton img {
        width: 24px;
        height: 24px;
      }

      .white-boton p {
        color: #055fb3;
        font-size: 0.85rem;
        font-weight: 500;
        line-height: 1.2;
      }

      /* WhatsApp */
      .info > div:last-child {
        display: flex;
        justify-content: center;
        margin-top: 8px;
      }

      .info > div:last-child img {
        width: 40px;
        height: 40px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="imagenes">
        <div class="heart">
          <img src="corazon.png" alt="Favorito" />
        </div>
        <div class="img-big">
          <img src="placeholder.png" alt="Imagen principal" />
          <img src="flecha.png" alt="Siguiente" />
        </div>
        <div class="img-small">
          <img src="placeholder.png" alt="Miniatura 1" />
          <img src="placeholder.png" alt="Miniatura 2" />
          <img src="placeholder.png" alt="Miniatura 3" />
        </div>
      </div>

      <div class="info">
        <div class="blue-boton">
          <img src="correo.png" alt="Correo" />
          <p>Contactar</p>
        </div>
        <div class="white-boton">
          <img src="euro.png" alt="Euro" />
          <p>Avísame si baja</p>
        </div>
        <div>
          <img src="whatsapp.png" alt="WhatsApp" />
        </div>
        <div><img src="logo.png" /></div>
      </div>
    </div>
  </body>
</html>
