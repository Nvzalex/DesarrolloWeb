<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anuncio piso</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        padding: 20px;
        background: #e6f6f5;
      }

      /* ===== 2. GRID IRREGULAR (estructura exterior) =====
         4 columnas y 2 filas. La imagen grande ocupa 3 columnas,
         las miniaturas una columna cada una y el panel de info
         ocupa la 4ª columna en las dos filas. */
      .card {
        display: grid;
        grid-template-columns: repeat(3, 1fr) 3fr; /* 3fr = suma de las 3 columnas de imagen: mitad exacta */
        grid-template-rows: 300px 90px;
        grid-template-areas:
          "big big big info"
          "t1  t2  t3  info";
        gap: 0; /* sin huecos para que cada mitad sea exacta */
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border: 1px solid #9fd8d3;
        border-radius: 12px;
        overflow: hidden;
      }

      /* --- Imagen grande --- */
      .img-big {
        grid-area: big;
        position: relative;
        background: #f5f5f5;
      }

      .img-big > img.principal {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Corazón: arriba a la derecha de la imagen grande */
      .heart {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 44px;
        height: 44px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .heart img {
        width: 24px;
        height: 24px;
      }

      /* Flecha: centrada a la derecha */
      .flecha {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 28px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 50%;
        padding: 4px;
      }

      /* --- Miniaturas (cada una en su área) --- */
      .img-small {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        cursor: pointer;
        border-top: 3px solid white;
        border-right: 3px solid white;
      }
      .t1 {
        grid-area: t1;
      }
      .t2 {
        grid-area: t2;
      }
      .t3 {
        grid-area: t3;
      }

      /* ===== 3. FLEXBOX (recuadro derecho) ===== */
      .info {
        grid-area: info;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 20px;
      }

      /* Logo arriba a la derecha */
      .logo {
        position: absolute;
        top: 0;
        right: 0;
        width: 80px;
      }

      .precio {
        font-size: 1.6rem;
        font-weight: 700;
      }

      .hipoteca {
        color: #3f5db7;
        font-size: 0.9rem;
      }

      .titulo {
        font-size: 1.1rem;
        font-weight: 500;
        margin-top: 8px;
      }

      .zona {
        color: #444;
      }

      /* Características alineadas a la derecha */
      .caracteristicas {
        display: flex;
        justify-content: flex-end;
        gap: 16px;
        font-size: 0.9rem;
      }

      .descripcion {
        font-size: 0.85rem;
        color: #555;
      }

      /* Botones: ocupan todo el ancho y se reparten con espacio proporcional */
      .botones {
        display: flex;
        justify-content: space-between;
        align-items: stretch;
        gap: 12px;
        width: 100%;
        margin-top: auto; /* empuja los botones al final del panel */
      }

      .blue-boton,
      .white-boton {
        flex: 1; /* crecen para ocupar todo el espacio disponible */
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 500;
      }

      .blue-boton {
        background-color: #3f5db7;
        color: white;
      }

      .white-boton {
        border: 1px solid #3f5db7;
        color: #3f5db7;
      }

      .blue-boton img,
      .white-boton img {
        width: 22px;
        height: 22px;
      }

      .whatsapp {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      .whatsapp img {
        width: 34px;
        height: 34px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Imagen grande con corazón y flecha -->
      <div class="img-big">
        <img class="principal" src="placeholder.png" alt="Imagen principal" />
        <div class="heart">
          <img src="corazon.png" alt="Favorito" />
        </div>
        <img class="flecha" src="flecha.png" alt="Siguiente" />
      </div>

      <!-- Miniaturas -->
      <img class="img-small t1" src="placeholder.png" alt="Miniatura 1" />
      <img class="img-small t2" src="placeholder.png" alt="Miniatura 2" />
      <img class="img-small t3" src="placeholder.png" alt="Miniatura 3" />

      <!-- Información (flexbox) -->
      <div class="info">
        <img class="logo" src="logo.png" alt="Logo" />

        <p class="precio">180.000 €</p>
        <p class="hipoteca">Calcula tu hipoteca</p>

        <p class="titulo">Piso en calle Venerables</p>
        <p class="zona">Centro (Burgos Capital)</p>

        <div class="caracteristicas">
          <span>1 hab.</span>
          <span>1 baño</span>
          <span>52 m²</span>
          <span>Bajo</span>
        </div>

        <p class="descripcion">Apartamento a estrenar en el centro de Burgos. Ubicado en una zona peatonal, que combina el encanto histórico con la…</p>

        <div class="botones">
          <div class="blue-boton">
            <img src="correo.png" alt="Correo" />
            <span>Contactar</span>
          </div>
          <div class="white-boton">
            <img src="euro.png" alt="Euro" />
            <span>Avísame si baja</span>
          </div>
          <div class="whatsapp">
            <img src="whatsapp.png" alt="WhatsApp" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
